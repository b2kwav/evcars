<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>EVCars – Configurateur Nouvelle Génération</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #030712;
      --bg-secondary: #0a0f1e;
      --surface: rgba(15, 23, 42, 0.6);
      --surface-elevated: rgba(30, 41, 59, 0.8);
      --accent-cyan: #00f0ff;
      --accent-electric: #00ff88;
      --accent-purple: #a855f7;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --glow-cyan: rgba(0, 240, 255, 0.4);
      --glow-electric: rgba(0, 255, 136, 0.3);
      --border-tech: rgba(0, 240, 255, 0.2);
    }
    
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Exo 2', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(0, 240, 255, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(0, 255, 136, 0.04) 0%, transparent 60%);
      animation: gradientShift 15s ease infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes gradientShift {
      0%, 100% { opacity: 1; transform: scale(1) rotate(0deg); }
      50% { opacity: 0.8; transform: scale(1.1) rotate(5deg); }
    }

    /* Scanline effect */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 240, 255, 0.03) 0px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 1;
      animation: scanline 8s linear infinite;
    }

    @keyframes scanline {
      0% { transform: translateY(0); }
      100% { transform: translateY(100px); }
    }

    /* Header with holographic effect */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border-tech);
      padding: 1rem 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 30px rgba(0, 240, 255, 0.1);
    }

    .logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-electric) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
      position: relative;
      text-shadow: 0 0 30px var(--glow-cyan);
      animation: logoGlow 3s ease-in-out infinite;
    }

    @keyframes logoGlow {
      0%, 100% { filter: drop-shadow(0 0 8px var(--glow-cyan)); }
      50% { filter: drop-shadow(0 0 20px var(--glow-cyan)); }
    }

    nav {
      display: flex;
      gap: 0.5rem;
    }

    nav button {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      padding: 0.7rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      font-family: 'Orbitron', sans-serif;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    nav button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    nav button:hover::before {
      left: 100%;
    }

    nav button.active,
    nav button:hover {
      background: rgba(0, 240, 255, 0.1);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      box-shadow: 0 0 20px var(--glow-cyan);
    }

    /* Main configurator layout */
    #configurator {
      display: flex;
      padding-top: 75px;
      height: 100vh;
      position: relative;
      z-index: 2;
    }

    /* Sidebar with tech aesthetic */
    #sidebar {
      width: 380px;
      background: rgba(10, 15, 30, 0.7);
      backdrop-filter: blur(30px) saturate(150%);
      border-right: 1px solid var(--border-tech);
      padding: 2rem 1.5rem;
      overflow-y: auto;
      position: relative;
    }

    #sidebar::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 1px;
      height: 100%;
      background: linear-gradient(180deg, 
        transparent 0%, 
        var(--accent-cyan) 20%, 
        var(--accent-cyan) 80%, 
        transparent 100%);
      box-shadow: 0 0 10px var(--glow-cyan);
      animation: borderPulse 3s ease-in-out infinite;
    }

    @keyframes borderPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    #sidebar::-webkit-scrollbar {
      width: 6px;
    }

    #sidebar::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }

    #sidebar::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--accent-cyan), var(--accent-electric));
      border-radius: 10px;
    }

    /* Step cards with holographic borders */
    .step {
      background: var(--surface);
      border-radius: 16px;
      margin-bottom: 1.8rem;
      border: 1px solid var(--border-tech);
      overflow: hidden;
      position: relative;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      animation: slideIn 0.6s ease-out backwards;
    }

    .step:nth-child(1) { animation-delay: 0.1s; }
    .step:nth-child(2) { animation-delay: 0.2s; }
    .step:nth-child(3) { animation-delay: 0.3s; }
    .step:nth-child(4) { animation-delay: 0.4s; }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .step::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, 
        transparent, 
        rgba(0, 240, 255, 0.1), 
        transparent);
      transition: left 0.6s;
    }

    .step:hover::before {
      left: 100%;
    }

    .step:hover {
      border-color: var(--accent-cyan);
      box-shadow: 0 8px 32px rgba(0, 240, 255, 0.2);
      transform: translateX(4px);
    }

    .step-header {
      padding: 1.2rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid var(--border-tech);
    }

    .step-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 3px;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .checkmark {
      color: var(--accent-electric);
      font-size: 1.5rem;
      opacity: 0;
      transition: all 0.3s;
      filter: drop-shadow(0 0 8px var(--glow-electric));
    }

    .step.valid .checkmark { 
      opacity: 1;
      animation: checkPop 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    @keyframes checkPop {
      0% { transform: scale(0) rotate(-180deg); }
      50% { transform: scale(1.2) rotate(10deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    /* Options with neon glow effect */
    .options-list {
      padding: 1.2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    label.option {
      width: 100%;
      padding: 1.1rem 1.3rem;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-size: 1rem;
      position: relative;
      overflow: hidden;
    }

    label.option::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow-cyan), transparent);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
      opacity: 0;
    }

    label.option:hover::before {
      width: 300px;
      height: 300px;
      opacity: 0.1;
    }

    label.option:hover {
      background: rgba(0, 240, 255, 0.08);
      border-color: var(--accent-cyan);
      transform: translateX(6px);
      box-shadow: 0 0 20px var(--glow-cyan);
    }

    input[type="radio"]:checked + label.option,
    input[type="checkbox"]:checked + label.option {
      background: linear-gradient(135deg, 
        rgba(0, 240, 255, 0.15), 
        rgba(0, 255, 136, 0.1));
      border-color: var(--accent-cyan);
      box-shadow: 
        0 0 20px var(--glow-cyan),
        inset 0 0 20px rgba(0, 240, 255, 0.1);
      transform: translateX(6px);
    }

    input[type="radio"],
    input[type="checkbox"] {
      display: none;
    }

    .option-desc {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 0.4rem;
      display: block;
      font-weight: 300;
    }

    /* Main view with dramatic lighting */
    #main-view {
      flex: 1;
      background: 
        radial-gradient(ellipse at top, rgba(10, 15, 30, 0.8) 0%, var(--bg-primary) 100%),
        linear-gradient(180deg, transparent 0%, rgba(0, 240, 255, 0.03) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Spotlight effect */
    #main-view::before {
      content: '';
      position: absolute;
      top: -50%;
      left: 50%;
      width: 150%;
      height: 150%;
      background: radial-gradient(
        ellipse at center,
        rgba(0, 240, 255, 0.15) 0%,
        transparent 50%
      );
      transform: translateX(-50%);
      animation: spotlight 8s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes spotlight {
      0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.5; }
      50% { transform: translateX(-50%) scale(1.2); opacity: 0.8; }
    }

    #car-image {
      max-width: 90%;
      max-height: 75vh;
      filter: drop-shadow(0 20px 60px rgba(0, 240, 255, 0.3));
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 1;
      position: relative;
      z-index: 2;
      animation: carFloat 6s ease-in-out infinite;
    }

    @keyframes carFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
    }

    #car-image.loading { 
      opacity: 0.3;
      filter: blur(10px) drop-shadow(0 20px 60px rgba(0, 240, 255, 0.1));
    }

    /* AI Chat bubble with futuristic design */
    #chat-bubble {
      position: absolute;
      bottom: 3rem;
      right: 3rem;
      width: 420px;
      background: rgba(10, 15, 30, 0.92);
      backdrop-filter: blur(30px) saturate(180%);
      border-radius: 20px;
      border: 1px solid var(--border-tech);
      padding: 1.8rem 2rem;
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.6),
        0 0 30px var(--glow-cyan),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      opacity: 0;
      transform: translateY(30px) scale(0.95);
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    #chat-bubble::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, 
        transparent,
        var(--accent-cyan),
        var(--accent-electric),
        transparent);
      animation: topGlow 3s linear infinite;
    }

    @keyframes topGlow {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    #chat-bubble.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .bubble-header {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      margin-bottom: 1rem;
    }

    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-family: 'Orbitron', sans-serif;
      color: #000;
      font-size: 1.4rem;
      position: relative;
      box-shadow: 
        0 0 20px var(--glow-cyan),
        inset 0 2px 10px rgba(255, 255, 255, 0.3);
      animation: avatarPulse 2s ease-in-out infinite;
    }

    @keyframes avatarPulse {
      0%, 100% { box-shadow: 0 0 20px var(--glow-cyan), inset 0 2px 10px rgba(255, 255, 255, 0.3); }
      50% { box-shadow: 0 0 40px var(--glow-cyan), inset 0 2px 10px rgba(255, 255, 255, 0.5); }
    }

    .bubble-title {
      font-weight: 700;
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-electric));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
    }

    .bubble-text {
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--text-secondary);
      font-weight: 300;
    }

    /* Typing indicator with holographic effect */
    .typing-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-electric));
      margin: 0 3px;
      animation: typing 1.4s ease-in-out infinite;
      box-shadow: 0 0 10px var(--glow-cyan);
    }

    .typing-indicator:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 100% { 
        opacity: 0.3; 
        transform: scale(0.8);
        box-shadow: 0 0 5px var(--glow-cyan);
      }
      50% { 
        opacity: 1; 
        transform: scale(1.2);
        box-shadow: 0 0 15px var(--glow-cyan);
      }
    }

    /* Grid overlay for tech feel */
    .tech-grid {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.3;
    }

    /* Particle effect corners */
    .corner-particle {
      position: fixed;
      width: 4px;
      height: 4px;
      background: var(--accent-cyan);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10;
      box-shadow: 0 0 10px var(--glow-cyan);
      animation: particleFloat 4s ease-in-out infinite;
    }

    .corner-particle.top-left { top: 100px; left: 30px; }
    .corner-particle.top-right { top: 120px; right: 40px; animation-delay: 1s; }
    .corner-particle.bottom-left { bottom: 80px; left: 50px; animation-delay: 2s; }
    .corner-particle.bottom-right { bottom: 100px; right: 60px; animation-delay: 3s; }

    @keyframes particleFloat {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
      50% { transform: translateY(-20px) scale(1.5); opacity: 1; }
    }
  </style>
</head>
<body>

<div class="tech-grid"></div>
<div class="corner-particle top-left"></div>
<div class="corner-particle top-right"></div>
<div class="corner-particle bottom-left"></div>
<div class="corner-particle bottom-right"></div>

<header>
  <div class="logo">EVCARS</div>
  <nav>
    <button class="active">VÉHICULE</button>
    <button>ÉNERGIE</button>
    <button>RECHARGE</button>
    <button>SHOP</button>
  </nav>
</header>

<div id="configurator">
  <aside id="sidebar">

    <div class="step" id="shape-step">
      <div class="step-header">
        <div class="step-title">SHAPE</div>
        <div class="checkmark">✓</div>
      </div>
      <div class="options-list">
        <input type="radio" name="shape" id="sedan" value="sedan" checked data-ai-title="Sedan Élégant" data-ai-text="Le sedan offre un design raffiné et aérodynamique avec un coefficient de traînée de seulement 0.24. Parfait pour les trajets quotidiens et les longs voyages autoroutiers, il combine élégance et efficacité énergétique. Son coffre spacieux de 530L saura accueillir tous vos bagages.">
        <label class="option" for="sedan">Sedan</label>

        <input type="radio" name="shape" id="suv" value="suv" data-ai-title="SUV Polyvalent" data-ai-text="Notre SUV électrique allie robustesse et praticité. Avec sa garde au sol relevée de 22cm et son hayon généreux, il s'adapte à tous vos besoins : famille nombreuse, équipements sportifs ou escapades nature. Les 7 places en option vous offrent une flexibilité maximale.">
        <label class="option" for="suv">SUV</label>

        <input type="radio" name="shape" id="hatch" value="hatchback" data-ai-title="Hatchback Urbain" data-ai-text="Compact et agile, le hatchback est conçu pour la ville. Son rayon de braquage réduit (10.4m) facilite les manœuvres et le stationnement. Malgré sa taille compacte, il propose 385L de coffre modulable. Idéal pour les trajets urbains avec une consommation optimisée de 14.2 kWh/100km.">
        <label class="option" for="hatch">Hatchback</label>
      </div>
    </div>

    <div class="step" id="color-step">
      <div class="step-header">
        <div class="step-title">COLOR</div>
        <div class="checkmark">✓</div>
      </div>
      <div class="options-list">
        <input type="radio" name="color" id="wire" value="wireframe" checked data-ai-title="Base Wireframe" data-ai-text="Cette vue technique vous permet de visualiser les lignes pures de votre future EVCar. C'est le point de départ idéal pour imaginer votre personnalisation. Sélectionnez une couleur pour voir instantanément le rendu final avec notre système de prévisualisation réaliste.">
        <label class="option" for="wire">Wireframe (base)</label>

        <input type="radio" name="color" id="blue" value="bleu-metallique" data-ai-title="Bleu Métallique Premium" data-ai-text="Notre bleu métallique signature capture la lumière de manière spectaculaire. Cette teinte triple couche avec effet nacré change de tonalité selon l'éclairage. Traitement céramique inclus pour une protection durable contre les UV et les micro-rayures. Un vrai coup de cœur chez nos clients !">
        <label class="option" for="blue">Bleu Métallique</label>

        <input type="radio" name="color" id="green" value="vert-profond" data-ai-title="Vert Profond Éco" data-ai-text="Le vert profond incarne notre engagement écologique. Cette peinture biosourcée contient 40% de matériaux renouvelables. Son aspect satiné profond est obtenu grâce à une nouvelle technologie de pigments naturels. Élégant et responsable, il reflète parfaitement l'ADN électrique d'EVCars.">
        <label class="option" for="green">Vert Profond</label>

        <input type="radio" name="color" id="black" value="noir-mat" data-ai-title="Noir Mat Furtif" data-ai-text="Le noir mat apporte une touche résolument moderne et sportive. Cette finition exclusive nécessite un processus de peinture en 5 étapes pour obtenir cet aspect velouté unique. Attention : entretien spécifique requis (pas de lavage automatique). Pour les puristes du design !">
        <label class="option" for="black">Noir Mat</label>
      </div>
    </div>

    <div class="step" id="engine-step">
      <div class="step-header">
        <div class="step-title">ENGINE</div>
        <div class="checkmark">✓</div>
      </div>
      <div class="options-list">
        <input type="radio" name="engine" id="std" value="standard" checked data-ai-title="Moteur Standard" data-ai-text="Notre moteur standard délivre 300 ch avec un couple instantané de 440 Nm. Batterie 75 kWh pour 450 km d'autonomie WLTP. Recharge rapide : 10 à 80% en 28 minutes sur borne 150 kW. Le meilleur équilibre performances/autonomie/prix pour un usage quotidien serein.">
        <label class="option" for="std">
          Standard
          <span class="option-desc">Équilibré – 450 km autonomie</span>
        </label>

        <input type="radio" name="engine" id="perf" value="performance" data-ai-title="Moteur Performance" data-ai-text="Bi-moteur intégral 520 ch ! 0 à 100 km/h en 3.8s grâce au Launch Control. Vectorisation de couple active sur chaque roue pour une tenue de route exceptionnelle. Batterie 85 kWh, autonomie 420 km. Mode Track avec refroidissement optimisé. Pour les passionnés de conduite sportive !">
        <label class="option" for="perf">
          Performance
          <span class="option-desc">0-100 km/h en 3.8s</span>
        </label>

        <input type="radio" name="engine" id="tow" value="towing" data-ai-title="Moteur Towing" data-ai-text="Spécialement calibré pour le remorquage : 380 ch, couple maximal de 680 Nm dès l'arrêt. Capacité de traction 1600 kg (caravane, bateau, van). Batterie renforcée 95 kWh avec gestion thermique optimisée pour les charges lourdes. Suspension arrière pneumatique auto-nivelante incluse.">
        <label class="option" for="tow">
          Towing
          <span class="option-desc">1600 kg de charge utile</span>
        </label>
      </div>
    </div>

    <div class="step" id="options-step">
      <div class="step-header">
        <div class="step-title">OPTIONS</div>
        <div class="checkmark">✓</div>
      </div>
      <div class="options-list">
        <input type="checkbox" id="sport" value="sport" data-ai-title="Pack Sport" data-ai-text="Jantes forgées 20 pouces (-8 kg par roue), pneus Michelin Pilot Sport EV homologués. Suspensions pilotées avec mode Sport+ (-15mm, amortissement variable). Étriers de frein rouge, sièges baquets en Alcantara avec maintiens latéraux renforcés. L'ADN racing d'EVCars !">
        <label class="option" for="sport">
          Pack Sport
          <span class="option-desc">Jantes 20", suspensions sport</span>
        </label>

        <input type="checkbox" id="tech" value="tech" data-ai-title="Pack Tech" data-ai-text="4 caméras 360° avec vue aérienne 3D et détection d'obstacles. Head-Up Display AR (réalité augmentée) projetant navigation et alertes. Conduite autonome niveau 2+ : régulateur adaptatif, centrage actif, changement de voie semi-auto. Parking automatique mains libres. Le futur, maintenant.">
        <label class="option" for="tech">
          Pack Tech
          <span class="option-desc">Caméra 360°, HUD</span>
        </label>

        <input type="checkbox" id="lux" value="luxury" data-ai-title="Pack Luxury" data-ai-text="Sièges Nappa premium 14 réglages avec massage 5 programmes et ventilation. Toit panoramique électrochrome (opacité variable). Système audio Harman Kardon 16 HP avec son 3D immersif. Éclairage d'ambiance 64 couleurs. Clé digitale smartphone. Le summum du confort.">
        <label class="option" for="lux">
          Pack Luxury
          <span class="option-desc">Sièges premium, toit pano</span>
        </label>
      </div>
    </div>

  </aside>

  <main id="main-view">
    <img id="car-image" src="images/config/sedan-wireframe.png" alt="Votre EVCar">

    <div id="chat-bubble">
      <div class="bubble-header">
        <div class="avatar">AI</div>
        <div class="bubble-title" id="bubble-title">Bienvenue !</div>
      </div>
      <div class="bubble-text" id="bubble-text">
        Configurez votre EVCar idéale en sélectionnant vos options. Je vous guiderai à chaque étape avec des informations détaillées sur chaque choix.
      </div>
    </div>
  </main>
</div>

<script>
  const carImg = document.getElementById('car-image');
  const chatBubble = document.getElementById('chat-bubble');
  const bubbleTitle = document.getElementById('bubble-title');
  const bubbleText = document.getElementById('bubble-text');

  let aiTimeout;

  function updateAIBubble(title, text) {
    chatBubble.classList.remove('visible');
    
    clearTimeout(aiTimeout);
    aiTimeout = setTimeout(() => {
      bubbleTitle.textContent = 'Analyse en cours';
      bubbleText.innerHTML = '<span class="typing-indicator"></span><span class="typing-indicator"></span><span class="typing-indicator"></span>';
      chatBubble.classList.add('visible');
      
      setTimeout(() => {
        bubbleTitle.textContent = title;
        bubbleText.textContent = text;
      }, 1000);
    }, 200);
  }

  function updateImage() {
    const shape = document.querySelector('[name="shape"]:checked')?.value || 'sedan';
    const color = document.querySelector('[name="color"]:checked')?.value || 'wireframe';
    const engine = document.querySelector('[name="engine"]:checked')?.value || '';
    let options = '';
    document.querySelectorAll('#options-step input:checked').forEach(el => {
      options += '+' + el.value;
    });

    let filename = `${shape}-${color}`;
    if (engine) filename += `-${engine}`;
    filename += options;

    const src = `images/config/${filename}.png`;

    carImg.classList.add('loading');
    const preload = new Image();
    preload.src = src;
    preload.onload = () => {
      carImg.src = src;
      carImg.classList.remove('loading');
    };
    preload.onerror = () => {
      carImg.src = `images/config/${shape}-wireframe.png`;
      carImg.classList.remove('loading');
    };
  }

  document.querySelectorAll('input[name="shape"], input[name="color"], input[name="engine"], #options-step input').forEach(el => {
    el.addEventListener('change', () => {
      updateImage();

      const step = el.closest('.step');
      if (step) {
        const checked = step.querySelector('input:checked');
        step.classList.toggle('valid', !!checked);
      }

      const aiTitle = el.dataset.aiTitle || 'Option sélectionnée';
      const aiText = el.dataset.aiText || 'Excellent choix ! Cette option améliorera votre expérience EVCars.';
      updateAIBubble(aiTitle, aiText);
    });
  });

  setTimeout(() => {
    chatBubble.classList.add('visible');
  }, 800);

  updateImage();
  document.querySelectorAll('.step').forEach(step => {
    step.classList.add('valid');
  });
</script>

</body>
</html>
