<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>EVCars – Configurateur</title>
  <link rel="stylesheet" href="assets/css/main.css" /> <!-- garde ton CSS original si besoin -->
  <style>
    :root {
      --bg-dark: #0a0e1a;
      --panel-bg: #11151f;
      --accent: #00d4ff;
      --accent-dark: #0099bb;
      --text: #e0f7ff;
      --border: rgba(0, 212, 255, 0.18);
    }
    body {
      background: var(--bg-dark);
      color: var(--text);
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #000;
      border-bottom: 1px solid var(--border);
      z-index: 100;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #logo {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--accent);
    }
    nav ul {
      display: flex;
      list-style: none;
      margin: 0;
      padding: 0;
      gap: 1.5rem;
    }
    nav a {
      color: white;
      text-decoration: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      transition: all 0.2s;
    }
    nav a.active,
    nav a:hover {
      background: var(--accent);
      color: #000;
    }

    #configurator {
      display: flex;
      min-height: 100vh;
      padding-top: 80px;
    }
    #sidebar {
      width: 340px;
      background: var(--panel-bg);
      padding: 2.5rem 1.8rem;
      border-right: 1px solid var(--border);
      overflow-y: auto;
    }
    h2 {
      color: var(--accent);
      font-size: 1.4rem;
      margin: 0 0 2rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .section-title {
      color: var(--accent);
      font-size: 1.1rem;
      margin: 1.8rem 0 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    button.option-btn {
      display: block;
      width: 100%;
      padding: 1rem 1.2rem;
      margin: 0.5rem 0;
      background: #1a2233;
      border: 1px solid var(--border);
      color: white;
      text-align: left;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
      font-size: 1rem;
    }
    button.option-btn:hover {
      background: #223344;
      border-color: var(--accent-dark);
    }
    button.option-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: bold;
    }

    #car-view {
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #car-image {
      max-width: 92%;
      max-height: 85vh;
      object-fit: contain;
      transition: opacity 0.5s ease, transform 0.5s ease;
      opacity: 1;
      transform: scale(1);
    }
    #car-image.loading {
      opacity: 0;
      transform: scale(0.98);
    }
    #placeholder-text {
      position: absolute;
      color: #334455;
      font-size: 5rem;
      opacity: 0.15;
      pointer-events: none;
    }
  </style>
</head>
<body>

<header>
  <div id="logo">EVCars</div>
  <nav>
    <ul>
      <li><a href="#" class="active">VÉHICULE</a></li>
      <li><a href="#">ÉNERGIE</a></li>
      <li><a href="#">RECHARGE</a></li>
      <li><a href="#">SHOP</a></li>
    </ul>
  </nav>
</header>

<div id="configurator">
  <aside id="sidebar">
    <h2>CONFIGURATION</h2>

    <div class="section-title">FORME</div>
    <button class="option-btn active" data-shape="sedan">SEDAN</button>
    <button class="option-btn" data-shape="suv">SUV</button>
    <button class="option-btn" data-shape="hatchback">HATCHBACK</button>

    <div class="section-title">COULEUR</div>
    <button class="option-btn active" data-color="wireframe">WIREFRAME (BASE)</button>
    <button class="option-btn" data-color="bleu-metallique">BLEU MÉTALLIQUE</button>
    <button class="option-btn" data-color="vert-profond">VERT PROFOND</button>
    <button class="option-btn" data-color="noir-mat">NOIR MAT</button>

    <!-- À venir : MOTEUR et OPTIONS -->
    <div class="section-title">MOTEUR</div>
    <p style="opacity:0.5; font-size:0.9rem;">(bientôt disponible)</p>
  </aside>

  <main id="car-view">
    <img id="car-image" src="images/config/sedan-wireframe.png" alt="Votre EVCar">
    <div id="placeholder-text">Votre EVCars</div>
  </main>
</div>

<script>
  const carImage = document.getElementById('car-image');

  // État actuel
  let current = {
    shape: 'sedan',
    color: 'wireframe'
  };

  function updateCarImage() {
    const filename = `${current.shape}-${current.color}.png`;
    const newSrc = `images/config/${filename}`;

    // Effet de chargement
    carImage.classList.add('loading');
    
    // Précharger pour éviter flicker
    const preload = new Image();
    preload.src = newSrc;
    preload.onload = () => {
      carImage.src = newSrc;
      carImage.classList.remove('loading');
    };
    preload.onerror = () => {
      // Fallback si l'image n'existe pas encore
      carImage.src = `images/config/${current.shape}-wireframe.png`;
      carImage.classList.remove('loading');
    };
  }

  // Gestion des formes
  document.querySelectorAll('[data-shape]').forEach(btn => {
    btn.addEventListener('click', () => {
      // Retirer active de tous les boutons forme
      document.querySelectorAll('[data-shape]').forEach(b => b.classList.remove('active'));
      // Ajouter active au cliqué
      btn.classList.add('active');
      
      current.shape = btn.dataset.shape;
      updateCarImage();
    });
  });

  // Gestion des couleurs
  document.querySelectorAll('[data-color]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-color]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      current.color = btn.dataset.color;
      updateCarImage();
    });
  });

  // Init
  updateCarImage();
</script>

</body>
</html>
