<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>EVCars – Configurateur</title>
  <style>
    /* ... (je garde exactement le même CSS que dans le message précédent pour ne pas alourdir) ... */
    #chat-bubble {
      position: absolute;
      bottom: 2.5rem;
      right: 2.5rem;
      width: 380px;
      background: rgba(20, 35, 60, 0.94);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 1.3rem 1.6rem;
      box-shadow: 0 15px 50px rgba(0,0,0,0.6);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    #chat-bubble.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .bubble-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.9rem;
    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #000;
      font-size: 1.3rem;
    }
    .bubble-text {
      font-size: 0.96rem;
      line-height: 1.55;
      color: #d8eaff;
    }
  </style>
</head>
<body>

<!-- Header et structure identiques à avant -->

<div id="configurator">
  <aside id="sidebar">
    <!-- Les 4 steps SHAPE / COLOR / ENGINE / OPTIONS exactement comme avant -->
    <!-- ... colle ici le contenu des <div class="step"> de la version précédente ... -->
  </aside>

  <main id="main-view">
    <img id="car-image" src="images/config/sedan-wireframe.png" alt="Votre EVCar">

    <div id="chat-bubble">
      <div class="bubble-header">
        <div class="avatar">AI</div>
        <div id="chat-title">Assistant EVCars</div>
      </div>
      <div class="bubble-text" id="chat-message">
        Bienvenue dans le configurateur ! Choisissez une forme pour commencer.
      </div>
    </div>
  </main>
</div>

<script>
  const carImg = document.getElementById('car-image');
  const chatBubble = document.getElementById('chat-bubble');
  const chatTitle = document.getElementById('chat-title');
  const chatMessage = document.getElementById('chat-message');

  // Messages du chatbot par catégorie et valeur
  const chatMessages = {
    init: {
      title: "Assistant EVCars",
      text: "Bienvenue ! Commencez par choisir la forme de votre véhicule."
    },
    shape: {
      sedan: {
        title: "Forme sélectionnée",
        text: "Le sedan offre un design élégant et aérodynamique, parfait pour un usage quotidien et les longs trajets."
      },
      suv: {
        title: "Forme sélectionnée",
        text: "Le SUV combine espace intérieur généreux, position de conduite surélevée et excellente visibilité."
      },
      hatchback: {
        title: "Forme sélectionnée",
        text: "Le hatchback est compact, agile en ville et offre un accès pratique au coffre."
      }
    },
    color: {
      wireframe: {
        title: "Mode Wireframe",
        text: "Vue de modélisation 3D de base. Choisissez une couleur pour voir le rendu final."
      },
      'bleu-metallique': {
        title: "Couleur appliquée",
        text: "Bleu Métallique Électrique : une teinte premium qui reflète la lumière avec élégance et modernité."
      },
      'vert-profond': {
        title: "Couleur appliquée",
        text: "Vert Profond : couleur audacieuse et écologique, très appréciée pour son caractère unique."
      },
      'noir-mat': {
        title: "Couleur appliquée",
        text: "Noir Mat Stealth : look discret, agressif et très tendance en 2026."
      }
    },
    engine: {
      standard: {
        title: "Moteur Standard",
        text: "Puissance équilibrée, autonomie maximale (~480 km WLTP), idéal pour un usage mixte ville/autoroute."
      },
      performance: {
        title: "Moteur Performance",
        text: "Accélération fulgurante (0-100 km/h en ~3.8s), couple instantané, suspensions sport. Autonomie légèrement réduite."
      },
      towing: {
        title: "Moteur Towing",
        text: "Capacité de remorquage jusqu'à 1600 kg, batterie renforcée et refroidissement optimisé pour charges lourdes."
      }
    },
    option: {
      sport: "Pack Sport ajouté : jantes 20\", kit carrosserie aérodynamique, suspensions sport → look et tenue de route renforcés.",
      tech: "Pack Tech activé : affichage tête haute, caméra 360°, assistant vocal avancé, recharge sans fil.",
      luxury: "Pack Luxury intégré : sièges en cuir végan premium, éclairage d’ambiance, toit panoramique ouvrant."
    }
  };

  function showChat(category, value) {
    let message = chatMessages.init;
    
    if (category === 'init') {
      message = chatMessages.init;
    } else if (category === 'option') {
      message = { title: "Option ajoutée", text: chatMessages.option[value] || "Option activée." };
    } else if (chatMessages[category] && chatMessages[category][value]) {
      message = chatMessages[category][value];
    }

    chatTitle.textContent = message.title;
    chatMessage.textContent = message.text;

    // Effet d'apparition
    chatBubble.classList.remove('visible');
    setTimeout(() => {
      chatBubble.classList.add('visible');
    }, 100);
  }

  function updateImageAndChat() {
    const shape = document.querySelector('[name="shape"]:checked')?.value || 'sedan';
    const color = document.querySelector('[name="color"]:checked')?.value || 'wireframe';
    const engine = document.querySelector('[name="engine"]:checked')?.value || '';

    let filename = `${shape}-${color}`;
    if (engine) filename += `-${engine}`;

    let optionsStr = '';
    const checkedOptions = [];
    document.querySelectorAll('#options-step input:checked').forEach(el => {
      optionsStr += '+' + el.value;
      checkedOptions.push(el.value);
    });
    filename += optionsStr;

    // Mise à jour image
    const src = `images/config/${filename}.png`;
    carImg.classList.add('loading');
    const preload = new Image();
    preload.src = src;
    preload.onload = () => {
      carImg.src = src;
      carImg.classList.remove('loading');
    };
    preload.onerror = () => {
      carImg.src = `images/config/${shape}-wireframe.png`;
      carImg.classList.remove('loading');
    };

    // Mise à jour chatbot (priorité au dernier changement)
    // Pour simplifier ici, on affiche le message du dernier choix détecté
    // (dans une vraie version, on pourrait stocker le dernier événement)
    if (engine) {
      showChat('engine', engine);
    } else if (color !== 'wireframe') {
      showChat('color', color);
    } else {
      showChat('shape', shape);
    }

    // Bonus : si options changent, on peut montrer la dernière ajoutée
    // (ici simplifié)
  }

  // Écoute tous les changements
  document.querySelectorAll('input[type="radio"], input[type="checkbox"]').forEach(input => {
    input.addEventListener('change', () => {
      updateImageAndChat();

      // Validation visuelle des steps
      const step = input.closest('.step');
      if (step) {
        const hasSelection = step.querySelector('input:checked');
        step.classList.toggle('valid', !!hasSelection);
      }
    });
  });

  // Initialisation
  showChat('init');
  updateImageAndChat();
</script>

</body>
</html>
